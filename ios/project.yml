# Generate the Xcode project with: xcodegen generate  (brew install xcodegen)
# The project is not committed — this file is the source of truth.
name: CantonApp
options:
  bundleIdPrefix: io.github.vsima
packages:
  canton-mobile-sdk:
    # Sibling checkout of vsima/canton-mobile-sdk, so the app always builds
    # against the SDK working tree. CI reproduces the same layout.
    path: ../../canton-mobile-sdk
targets:
  CantonApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [Sources]
    dependencies:
      - package: canton-mobile-sdk
        product: CantonKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vsima.canton.app
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
