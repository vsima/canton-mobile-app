# Generate the Xcode project with: xcodegen generate  (brew install xcodegen)
# The project is not committed — this file is the source of truth.
#
# Two reference apps, one project:
#   CantonWallet — the wallet, links the wallet SDK stack.
#   CantonDapp   — a CIP-0103 dApp, links ONLY CantonDappKit, so it cannot
#                  see the signing drivers or Ledger API stubs. The build
#                  succeeding from that dependency alone is the layering proof.
name: Canton
options:
  bundleIdPrefix: io.github.vsima
packages:
  canton-mobile-sdk:
    # Sibling checkout of vsima/canton-mobile-sdk, so the apps always build
    # against the SDK working tree. CI reproduces the same layout.
    path: ../../canton-mobile-sdk
  reown-swift:
    # Reown WalletKit — the WalletConnect relay client, wallet side. Only the
    # CantonWallet target links it; the SDK's CantonDappWCKit adapter stays
    # client-free, exactly like the Kotlin canton-dapp-wc module.
    url: https://github.com/reown-com/reown-swift
    from: 1.8.0
targets:
  CantonWallet:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [Sources/Wallet]
    dependencies:
      - package: canton-mobile-sdk
        product: CantonKit
      - package: canton-mobile-sdk
        product: CantonWalletKit
      # The dev faucet builds its operator-side command submission from the
      # generated Ledger API protos directly.
      - package: canton-mobile-sdk
        product: CantonLedgerAPI
      # dApp-connect over WalletConnect: the provider engine + prepareExecute
      # pipeline (CantonDappWalletKit), the CIP-0103 WalletConnect adapter
      # (CantonDappWCKit), and the Reown relay client that moves the frames.
      - package: canton-mobile-sdk
        product: CantonDappWalletKit
      - package: canton-mobile-sdk
        product: CantonDappWCKit
      - package: reown-swift
        product: ReownWalletKit
      - package: reown-swift
        product: WalletConnectNetworking
    info:
      path: Wallet-Info.plist
      properties:
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        NSCameraUsageDescription: Scan a recipient's QR code to fill in their party id.
        # Dev builds talk plaintext to LocalNet on the loopback/LAN. The
        # exception domain covers scan.localhost/wallet.localhost — ATS
        # does not exempt .localhost subdomains by default.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        # canton-checkout: opens the wallet from a QR; canton-wallet:// is the
        # WalletConnect redirect a dApp uses to return here after approval.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.vsima.canton.app.checkout
            CFBundleURLSchemes:
              - canton-checkout
          - CFBundleURLName: io.github.vsima.canton.app.walletconnect
            CFBundleURLSchemes:
              - canton-wallet
    settings:
      base:
        # Unchanged from the single-app layout: the installed wallet keeps its
        # identity (and its device-bound key and party).
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vsima.canton.app
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The App Group Reown's relay keychain needs (see Wallet.entitlements).
        CODE_SIGN_ENTITLEMENTS: Wallet.entitlements
  CantonDapp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [Sources/Dapp]
    dependencies:
      - package: canton-mobile-sdk
        product: CantonDappKit
    info:
      path: Dapp-Info.plist
      properties:
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        # Dev builds reach a wallet over the LAN (or loopback) in plaintext.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vsima.canton.dapp.app
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
