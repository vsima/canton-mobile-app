org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# material-icons-extended is a ~13k-class artifact; dexing it needs more
# heap than the Gradle default, which OOMs the daemon on CI runners.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Reown WalletKit ships Rust/uniffi native bindings that R8 full mode strips.
android.enableR8.fullMode=false
