name: ios

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: app (simulator build)
    runs-on: macos-26
    defaults:
      run:
        working-directory: canton-mobile-app/ios
    steps:
      - uses: actions/checkout@v4
        with:
          path: canton-mobile-app
      # Sibling SDK checkout, matching the local development layout that
      # ios/project.yml's relative package path expects.
      - uses: actions/checkout@v4
        with:
          repository: vsima/canton-mobile-sdk
          path: canton-mobile-sdk
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build wallet
        run: >
          xcodebuild -project Canton.xcodeproj -scheme CantonWallet
          -destination 'generic/platform=iOS Simulator'
          build CODE_SIGNING_ALLOWED=NO
      - name: Build dApp
        run: >
          xcodebuild -project Canton.xcodeproj -scheme CantonDapp
          -destination 'generic/platform=iOS Simulator'
          build CODE_SIGNING_ALLOWED=NO
