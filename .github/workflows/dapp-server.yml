name: dapp-server

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: dapp-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: dapp-server (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dapp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Runs the TypeScript sources directly via Node's native type
          # stripping — no build step — so it needs a Node with that stable.
          node-version: 24
          cache: npm
          cache-dependency-path: dapp-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
